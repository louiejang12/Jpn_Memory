<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#58cc02">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="단어퀴즈">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>일본어 단어퀴즈</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 홈 -->
    <section class="view" id="view-home">
      <header class="topbar">
        <div class="stat-pill" title="연속 학습일"><i data-ic="flame"></i><b id="h-streak">0</b></div>
        <div class="stat-pill" title="총 XP"><i data-ic="bolt"></i><b id="h-xp">0</b></div>
        <div class="stat-pill" title="오답노트"><i data-ic="note"></i><b id="h-wrong">0</b></div>
        <button class="icon-btn" id="reloadBtn" aria-label="앱 새로고침"><i data-ic="retry"></i></button>
        <button class="icon-btn" id="settingsBtn" aria-label="설정"><i data-ic="sliders"></i></button>
      </header>
      <div class="scroll" id="home-body"></div>
    </section>

    <!-- 오답노트 -->
    <section class="view" id="view-wrong">
      <header class="topbar"><h1>오답노트</h1></header>
      <div class="scroll" id="wrong-body"></div>
    </section>

    <!-- 단어장 -->
    <section class="view" id="view-words">
      <header class="topbar"><h1>단어장</h1></header>
      <div class="scroll" id="words-body"></div>
    </section>

    <!-- 기록 -->
    <section class="view" id="view-stats">
      <header class="topbar"><h1>학습 기록</h1></header>
      <div class="scroll" id="stats-body"></div>
    </section>

    <!-- 퀴즈 -->
    <section class="view" id="view-quiz">
      <header class="quiz-top">
        <button class="icon-btn close" id="quitBtn" aria-label="그만하기"><i data-ic="close"></i></button>
        <div class="progress"><div class="bar" id="q-bar"></div></div>
        <div class="combo" id="q-combo"></div>
      </header>
      <main class="quiz-main" id="q-main"></main>
      <footer class="quiz-foot" id="q-foot"></footer>
    </section>

    <!-- 결과 -->
    <section class="view" id="view-result">
      <div class="scroll" id="result-body"></div>
    </section>

    <!-- 플래시카드 -->
    <section class="view" id="view-flash">
      <header class="quiz-top">
        <button class="icon-btn close" id="flashQuit" aria-label="닫기"><i data-ic="close"></i></button>
        <div class="progress"><div class="bar blue" id="f-bar"></div></div>
        <button class="icon-btn small" id="flashDir" aria-label="방향 바꾸기"><i data-ic="swap"></i></button>
      </header>
      <main class="flash-main" id="f-main"></main>
    </section>

    <nav class="tabbar" id="tabbar">
      <button data-tab="home" class="active"><i data-ic="home"></i>학습</button>
      <button data-tab="wrong"><i data-ic="wrong"></i>오답노트</button>
      <button data-tab="words"><i data-ic="book"></i>단어장</button>
      <button data-tab="stats"><i data-ic="chart"></i>기록</button>
    </nav>
  </div>

  <!-- 설정 시트 -->
  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-label="설정">
      <div class="sheet-head"><h2>설정</h2><button class="icon-btn" id="sheetClose" aria-label="닫기"><i data-ic="close"></i></button></div>
      <div id="settings-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
